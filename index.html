<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lightweight Charts Custom Indicator</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.umd.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif; background-color: #131722; }
        #chart-container { width: 90%; height: 500px; margin: 20px auto; background-color: #131722; }
    </style>
</head>
<body>
    <div id="chart-container"></div>

    <script>
        const chartContainer = document.getElementById('chart-container');

        // Initialize the chart
        const chart = LightweightCharts.createChart(chartContainer, {
            width: chartContainer.offsetWidth,
            height: chartContainer.offsetHeight,
            layout: {
                background: { type: 'solid', color: '#131722' },
                textColor: '#d1d4dc',
            },
            grid: {
                vertLines: { color: '#242738' },
                horzLines: { color: '#242738' },
            },
            timeScale: {
                timeVisible: true,
                secondsVisible: false,
            },
        });

        // Add a candlestick series
        const candlestickSeries = chart.addCandlestickSeries({
            upColor: '#26a69a',
            downColor: '#ef5350',
            borderVisible: false,
            wickUpColor: '#26a69a',
            wickDownColor: '#ef5350',
        });

        // --- Generate Dummy Data ---
        function generateData(count) {
            const data = [];
            let time = new Date(Date.UTC(2023, 0, 1, 0, 0, 0));
            let open = 100;
            for (let i = 0; i < count; i++) {
                const close = open * (1 + (Math.random() - 0.5) * 0.1);
                const high = Math.max(open, close) * (1 + Math.random() * 0.05);
                const low = Math.min(open, close) * (1 - Math.random() * 0.05);

                data.push({
                    time: time.getTime() / 1000, // Lightweight Charts expects Unix timestamp in seconds
                    open: parseFloat(open.toFixed(2)),
                    high: parseFloat(high.toFixed(2)),
                    low: parseFloat(low.toFixed(2)),
                    close: parseFloat(close.toFixed(2)),
                });

                open = close;
                time.setUTCDate(time.getUTCDate() + 1);
            }
            return data;
        }

        const dummyData = generateData(100);
        candlestickSeries.setData(dummyData);

        // --- Custom Indicator: Simple Moving Average (SMA) ---
        // This section demonstrates adding a custom indicator to Lightweight Charts.
        // The article discusses extending the chart's capabilities beyond its built-in features.
        function calculateSMA(data, period) {
            const smaData = [];
            for (let i = 0; i < data.length; i++) {
                if (i >= period - 1) {
                    let sum = 0;
                    for (let j = 0; j < period; j++) {
                        sum += data[i - j].close;
                    }
                    smaData.push({
                        time: data[i].time,
                        value: parseFloat((sum / period).toFixed(2)),
                    });
                }
            }
            return smaData;
        }

        const smaPeriod = 14; // 14-period Simple Moving Average
        const smaData = calculateSMA(dummyData, smaPeriod);

        // Add a line series for the SMA indicator
        const smaSeries = chart.addLineSeries({
            color: '#00bcd4', // A distinct color for the indicator line
            lineWidth: 2,
            priceLineVisible: false,
            lastValueVisible: false,
        });

        smaSeries.setData(smaData); // Set the calculated SMA data to the new series

        // --- Handle window resize ---
        new ResizeObserver(entries => {
            if (entries.length === 0 || entries[0].target !== chartContainer) {
                return;
            }
            const newRect = entries[0].contentRect;
            chart.applyOptions({ height: newRect.height, width: newRect.width });
        }).observe(chartContainer);

    </script>
</body>
</html>
